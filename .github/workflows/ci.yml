name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run -w apps/web typecheck

      # Tests were never run in CI before 2026-06-08 — the login outage proved
      # the gap. The suite includes the middleware auth-safety invariant
      # (apps/web/src/middleware.test.ts) that guards the sign-in path.
      - run: npm run -w apps/web test

      # The Hangar runner (stream parser, worktree lifecycle, engine adapters)
      # has its own suite; it shipped without a CI gate until 2026-09-03.
      - run: npm run -w apps/kairos-worker typecheck
      - run: npm run -w apps/kairos-worker test

      # A production build is the only gate that catches build-time-only
      # failures: lint, typecheck and tests all passed the malformed
      # color-mix() shadow that broke the 2026-08-26 deploy. Placeholder env
      # only satisfies import-time guards — every route is dynamic, so the
      # build never opens a connection.
      - run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-value-not-a-secret
          AI_KEYS_MASTER_KEY: ci-placeholder-value-not-a-secret
